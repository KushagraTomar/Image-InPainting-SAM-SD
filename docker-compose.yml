version: '3.8'

services:
  image-inpainting:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-inpainting-app
    ports:
      - "8000:8000"
    volumes:
      # Mount directories for persistent data
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./pretrained:/app/pretrained
      # Optional: mount static files for development
      - ./static:/app/static
    environment:
      - PYTHONUNBUFFERED=1
    #  - CUDA_VISIBLE_DEVICES=0
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: image-inpainting-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - image-inpainting
    restart: unless-stopped
    profiles:
      - production

volumes:
  uploads:
  results:
  pretrained: