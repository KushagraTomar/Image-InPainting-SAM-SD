apiVersion: v1
kind: Service
metadata:
  name: image-inpainting-service
  namespace: default
  labels:
    app: image-inpainting
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: image-inpainting
---
apiVersion: v1
kind: Service
metadata:
  name: image-inpainting-nodeport
  namespace: default
  labels:
    app: image-inpainting
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30800
    protocol: TCP
    name: http
  selector:
    app: image-inpainting
---
apiVersion: v1
kind: Service
metadata:
  name: image-inpainting-loadbalancer
  namespace: default
  labels:
    app: image-inpainting
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8000
    protocol: TCP
    name: https
  selector:
    app: image-inpainting
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-inpainting-ingress
  namespace: default
  labels:
    app: image-inpainting
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - image-inpainting.yourdomain.com
    secretName: image-inpainting-tls
  rules:
  - host: image-inpainting.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: image-inpainting-service
            port:
              number: 8000